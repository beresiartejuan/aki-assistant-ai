name: Deploy landing

# La landing vive en index.html en la raíz del repo y se publica
# tal cual (estático, sin build) en GitHub Pages.
#
# Requiere (una sola vez): Settings → Pages → Build and deployment
# → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5